name: Update contribution stats

on:
  schedule:
    # Runs once a day at 12:00 UTC (7:00 AM Toronto time). Adjust as you like.
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  update-svg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate contributions SVG
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.STATS_PAT }}
          OUT_PATH: panel-contributions.svg
        run: python3 scripts/generate_contributions_svg.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet panel-contributions.svg; then
            git add panel-contributions.svg
            git commit -m "chore: update contribution stats [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
